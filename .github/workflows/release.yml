# A tag v* builds both packages with the shared FM-1 build workflow, attests them and publishes them as the tag's release.
name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: sh build.sh --release "${GITHUB_REF_NAME#v}" --board smk37 && sh build.sh --release "${GITHUB_REF_NAME#v}"
      packages: build/stallion-*.fwsc
